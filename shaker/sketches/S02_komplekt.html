<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../fonts/fonts.css">
<style>html,body{margin:0;width:1536px;height:2048px;overflow:hidden;background:#EDEDEB}</style></head><body>
<svg id="scene" width="1536" height="2048" viewBox="0 0 1536 2048"></svg>
<script src="lib/kit.js"></script>
<script>
// S02 — knolling flat-lay, camera straight down, all 6 parts on a 2×3 grid.
// Mild top-down relief: camera above the content centre C at height HC, so taller parts show a sliver
// of outer wall on the side facing C and open containers show inner-wall depth.
const W = 1536, H = 2048, R = n => Math.round(n * 100) / 100;
const C = { x: 768, y: 1240 }, HC = 2400;
const kAt = h => HC / (HC + h);                        // scale of a plane h px below the top plane
const below = (x, y, h) => ({ x: C.x + (x - C.x) * kAt(h), y: C.y + (y - C.y) * kAt(h), k: kAt(h) });
const LX = 16, LY = 22;                                 // key light upper-left → shadow offset (lower-right)

function shadowCircle(x, y, r, h) {                     // soft floor shadow of a round part of height h
  const f = Math.min(1, h / 200);
  return `<circle cx="${R(x + LX * (0.4 + f))}" cy="${R(y + LY * (0.4 + f))}" r="${R(r * 1.0)}" fill="rgba(0,0,0,${R(0.16 + 0.06 * f)})" filter="url(#bl14)"/>
          <circle cx="${R(x + 3)}" cy="${R(y + 4)}" r="${R(r * 0.99)}" fill="rgba(0,0,0,.25)" filter="url(#bl4)"/>`;
}
// outer wall sliver: hull of top circle (x,y,r) and base circle (h below)
function wall(x, y, r, h, fill = '#1E1F23') {
  const b = below(x, y, h), rb = r * b.k;
  const dx = b.x - x, dy = b.y - y, L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
  return `<circle cx="${R(b.x)}" cy="${R(b.y)}" r="${R(rb)}" fill="${fill}"/>
    <path d="M${R(x + nx * r)},${R(y + ny * r)} L${R(b.x + nx * rb)},${R(b.y + ny * rb)} L${R(b.x - nx * rb)},${R(b.y - ny * rb)} L${R(x - nx * r)},${R(y - ny * r)} Z" fill="${fill}"/>`;
}
// open round container seen from above (long lens, straight down): rim ring, lit inner wall, smaller floor
// for deeper parts (depth cue), floor nudged toward the content centre C.
function openTop(x, y, d, h, { dividers = 0, rimW = 0.07 } = {}) {
  const r = d / 2, ri = r * (1 - rimW), id = `cl${Math.round(x)}_${Math.round(y)}`;
  const kf = 1 - 0.36 * h / 360, f = { x: x + (C.x - x) * 0.05 * h / 360, y: y + (C.y - y) * 0.05 * h / 360 }, rf = ri * kf;
  let s = shadowCircle(x, y, r, h);
  s += `<circle cx="${x}" cy="${y}" r="${R(r)}" fill="${K.lid}"/>`;
  s += `<circle cx="${x}" cy="${y}" r="${R(r)}" fill="url(#rimGloss)"/>`;
  s += `<clipPath id="${id}"><circle cx="${x}" cy="${y}" r="${R(ri)}"/></clipPath><g clip-path="url(#${id})">
          <rect x="${R(x - r)}" y="${R(y - r)}" width="${R(d)}" height="${R(d)}" fill="url(#innerWall)"/>
          <circle cx="${R(f.x)}" cy="${R(f.y)}" r="${R(rf)}" fill="#25262A" stroke="#0C0C0E" stroke-width="2"/>
          <circle cx="${R(f.x)}" cy="${R(f.y)}" r="${R(rf)}" fill="url(#floorLight)"/>
          <ellipse cx="${R(f.x - rf * 0.30)}" cy="${R(f.y - rf * 0.32)}" rx="${R(rf * 0.30)}" ry="${R(rf * 0.16)}" transform="rotate(-35 ${R(f.x - rf * 0.30)} ${R(f.y - rf * 0.32)})" fill="rgba(255,255,255,.16)" filter="url(#bl4)"/>
          <circle cx="${R(x - ri * 0.10)}" cy="${R(y - ri * 0.12)}" r="${R(ri * 1.02)}" fill="none" stroke="rgba(0,0,0,.55)" stroke-width="${R(ri * 0.16)}" filter="url(#bl4)"/>`;
  if (dividers) for (let i = 0; i < dividers; i++) {
    const a = (-90 + i * 360 / dividers) * Math.PI / 180;
    s += `<path d="M${R(x)},${R(y)} L${R(x + Math.cos(a) * ri)},${R(y + Math.sin(a) * ri)} L${R(f.x + Math.cos(a) * rf)},${R(f.y + Math.sin(a) * rf)} L${R(f.x)},${R(f.y)} Z" fill="#2A2B30"/>
          <path d="M${R(x)},${R(y)} L${R(x + Math.cos(a) * ri)},${R(y + Math.sin(a) * ri)}" stroke="#46474D" stroke-width="${R(d * 0.03)}" stroke-linecap="round"/>`;
  }
  if (!dividers) s += `<circle cx="${R(f.x)}" cy="${R(f.y)}" r="${R(d * 0.016)}" fill="#34353A"/>`;   // moulding dot
  s += `</g><circle cx="${x}" cy="${y}" r="${R(ri)}" fill="none" stroke="#050506" stroke-width="3"/>`;
  // thin highlight on the rim lip, upper-left
  s += `<path d="M${R(x - r * 0.93 * Math.cos(0.35))},${R(y + r * 0.93 * Math.sin(0.35))} A${R(r * 0.93)},${R(r * 0.93)} 0 0 1 ${R(x + r * 0.93 * Math.sin(0.35))},${R(y - r * 0.93 * Math.cos(0.35))}" fill="none" stroke="rgba(255,255,255,.34)" stroke-width="4" stroke-linecap="round"/>`;
  return `<g>${s}</g>`;
}

const s = [];
s.push(Kit.defs(), `<defs>
  <filter id="bl14" filterUnits="userSpaceOnUse" x="0" y="0" width="1536" height="2048"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="bl4" filterUnits="userSpaceOnUse" x="0" y="0" width="1536" height="2048"><feGaussianBlur stdDeviation="4"/></filter>
  <radialGradient id="table" cx=".3" cy=".25" r=".9"><stop offset="0" stop-color="#F4F4F2"/><stop offset="1" stop-color="#E6E6E3"/></radialGradient>
  <radialGradient id="rimGloss" cx=".32" cy=".28" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".5" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#000" stop-opacity=".25"/></radialGradient>
  <linearGradient id="innerWall" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#050506"/><stop offset=".5" stop-color="#1A1B1E"/><stop offset="1" stop-color="#6A6B70"/></linearGradient>
  <radialGradient id="floorLight" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".10"/><stop offset="1" stop-color="#000" stop-opacity=".2"/></radialGradient>
  <linearGradient id="glossV" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset=".18" stop-color="#fff" stop-opacity=".16"/>
    <stop offset=".27" stop-color="#fff" stop-opacity=".30"/><stop offset=".36" stop-color="#fff" stop-opacity=".06"/>
    <stop offset=".78" stop-color="#000" stop-opacity=".05"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></linearGradient>
</defs>`);
s.push(`<rect width="${W}" height="${H}" fill="url(#table)"/>`);

const WC = 360;                                   // cup diameter = tier diameter
const X1 = 430, X2 = 1106, Y1 = 770, Y2 = 1250, Y3 = 1730;

// 1 — cup lying on its side, bottom left, open mouth right, logo up reading left→right
{
  const L = WC * 1.4, x0 = X1 - L / 2, y0 = Y1 - WC / 2;
  s.push(`<rect x="${R(x0 + 18)}" y="${R(y0 + 40)}" width="${R(L)}" height="${R(WC)}" rx="20" fill="rgba(0,0,0,.20)" filter="url(#bl14)"/>`);
  s.push(`<rect x="${R(x0 + 4)}" y="${R(y0 + WC * 0.55)}" width="${R(L - 8)}" height="${R(WC * 0.47)}" fill="rgba(0,0,0,.28)" filter="url(#bl4)"/>`);
  s.push(`<rect x="${R(x0)}" y="${R(y0)}" width="${R(L)}" height="${R(WC)}" fill="${K.body}"/>`);
  s.push(`<rect x="${R(x0)}" y="${R(y0)}" width="${R(L)}" height="${R(WC)}" fill="url(#glossV)"/>`);
  // bottom rim (left) and thread ridges at the mouth (right)
  s.push(`<rect x="${R(x0)}" y="${R(y0)}" width="${R(WC * 0.05)}" height="${R(WC)}" fill="#1A1B1E"/>`);
  for (let i = 0; i < 3; i++) s.push(`<rect x="${R(x0 + L - WC * 0.035 - i * WC * 0.03)}" y="${R(y0 + 2)}" width="3" height="${R(WC - 4)}" fill="#141417"/>`);
  // open mouth seen edge-on with a little relief: narrow dark ellipse at the right end
  s.push(`<ellipse cx="${R(x0 + L)}" cy="${R(Y1)}" rx="${R(WC * 0.06)}" ry="${R(WC / 2)}" fill="${K.lid}"/>`);
  s.push(`<ellipse cx="${R(x0 + L + 2)}" cy="${R(Y1)}" rx="${R(WC * 0.045)}" ry="${R(WC / 2 - 9)}" fill="#060607"/>`);
  // logo: kit vertical print rotated with the cup (bottom→top becomes left→right)
  s.push(`<g transform="rotate(90 ${X1} ${Y1})">${Kit.logo(X1, Y1 - L / 2, WC, L)}</g>`);
}
// 2 — lid, cap closed, lying cap-up
{
  const d = WC * 1.07, h = WC * 0.54;
  s.push(shadowCircle(X2, Y1, d / 2, h));
  s.push(`<circle cx="${X2}" cy="${Y1}" r="${R(d / 2)}" fill="${K.lid}"/>`);                       // ring
  s.push(`<circle cx="${X2}" cy="${Y1}" r="${R(d / 2)}" fill="url(#rimGloss)"/>`);
  s.push(`<circle cx="${X2}" cy="${Y1}" r="${R(d * 0.43)}" fill="#212226" stroke="#0A0A0C" stroke-width="3"/>`);   // dome
  s.push(`<circle cx="${X2}" cy="${Y1}" r="${R(d * 0.43)}" fill="url(#rimGloss)" opacity=".8"/>`);
  // closed flip cap: rounded tab over the spout, finger-loop at the right end (kit lidTop geometry)
  s.push(`<rect x="${R(X2 - WC * 0.31 + 6)}" y="${R(Y1 - WC * 0.07 + 8)}" width="${R(WC * 0.62)}" height="${R(WC * 0.14)}" rx="${R(WC * 0.07)}" fill="rgba(0,0,0,.35)" filter="url(#bl4)"/>`);
  s.push(`<rect x="${R(X2 - WC * 0.31)}" y="${R(Y1 - WC * 0.07)}" width="${R(WC * 0.62)}" height="${R(WC * 0.14)}" rx="${R(WC * 0.07)}" fill="${K.rim}"/>`);
  s.push(`<rect x="${R(X2 - WC * 0.31)}" y="${R(Y1 - WC * 0.07)}" width="${R(WC * 0.62)}" height="${R(WC * 0.14)}" rx="${R(WC * 0.07)}" fill="url(#glossV)" opacity=".6"/>`);
  s.push(`<circle cx="${R(X2 + WC * 0.22)}" cy="${Y1}" r="${R(WC * 0.035)}" fill="#3A3B40"/>`);
}
// 3 — whisk disc (ring, 3 spokes, steel conical spiral)
{
  const r = WC * 0.46;
  s.push(`<circle cx="${X1 + 10}" cy="${Y2 + 14}" r="${R(r)}" fill="none" stroke="rgba(0,0,0,.2)" stroke-width="${R(r * 0.1)}" filter="url(#bl4)"/>`);
  s.push(`<circle cx="${X1 + 8}" cy="${Y2 + 12}" r="${R(r * 0.55)}" fill="rgba(0,0,0,.08)" filter="url(#bl14)"/>`);
  s.push(Kit.whisk(X1, Y2, r, 1));
}
// 4 — pill organizer, 3 sections, empty (smaller diameter than the tiers)
s.push(openTop(X2, Y2, WC * 0.82, WC * 0.30, { dividers: 3 }));
// 5 — short storage container (open, empty)
s.push(openTop(X1, Y3, WC, WC * 0.40));
// 6 — tall storage container (open, empty)
s.push(openTop(X2, Y3, WC, WC * 0.80));

document.getElementById('scene').innerHTML = s.join('');
</script></body></html>
