<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>01 · Набор</title>
<link rel="stylesheet" href="../../../fonts/fonts.css">
<link rel="stylesheet" href="../base.css">
<style>
  /* photo 01 at s = .575 · product box (photo px) 130..1506 × 387..1814, floor shadow 1834..1960
     → canvas: ring left on the margin (x 64), ring top y 396, grips end y 1216 (32 px above the band) */
  .p01 {
    width: 883px; left: -11px; top: 174px;
    /* right edge is only 30 photo-px past the carabiners; the floor shadow is dropped —
       the volt band is the floor */
    --mx: linear-gradient(to right, #000 97.6%, transparent 99.6%);
    --my: linear-gradient(to bottom, transparent 4%, #000 9%, #000 88.9%, transparent 90.2%);
  }

  /* one grid line: band top = second rule of the column (y 1248) */
  .band { bottom: var(--m); height: 128px; width: 664px; }   /* slanted top-right corner stops 33 px short of the column */
  .band .num { font-size: 124px; transform: translateY(2px); }
  .band .label { line-height: 1.08; }

  .col { position: absolute; left: 724px; right: var(--m); bottom: var(--m); }
  .lvl { display: flex; align-items: flex-end; gap: 18px; }
  .lvl .num { font-size: 120px; }
  .lvl .label { transform: translateY(6px); }
  .kg { height: 128px; padding-top: 16px; }
  .kg .label { margin-bottom: 10px; }
  .kg .num { font-size: 72px; display: flex; align-items: baseline; gap: 10px; }
  .kg .num .unit { font-size: 36px; }
</style>
</head>
<body>
<div class="slide">
  <header class="chrome">
    <span class="chrome__idx"><b>01</b><i>/08</i></span>
    <span class="chrome__rule"></span>
    <span class="chrome__tag">Набор</span>
  </header>

  <h1 class="title title--cover"><span>Спортзал</span><span>у вас дома</span></h1>

  <img class="photo photo--soft p01" src="../../../src/01_oblozhka.jpg" alt="">

  <div class="volt-band band">
    <div class="num">11 в 1</div>
    <div class="label">Набор<br>эспандеров</div>
  </div>

  <div class="col">
    <div class="fact-blk lvl">
      <div class="num">5</div>
      <div class="label">уровней<br>нагрузки</div>
    </div>
    <div class="fact-blk kg">
      <div class="label">Общая нагрузка</div>
      <div class="num"><span class="unit">до</span><b data-spec="res_total_kg"></b><span class="unit">кг</span></div>
    </div>
  </div>
</div>
<script src="../../../lib/bind.js"></script>
</body>
</html>
