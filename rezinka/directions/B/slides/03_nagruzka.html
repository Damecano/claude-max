<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>03 · Нагрузка</title>
<link rel="stylesheet" href="../../../fonts/fonts.css">
<link rel="stylesheet" href="../base.css">
<style>
  /* photo 03 full-bleed at exact canvas scale (1536 → 1080, s = .7031): no photo edge can
     appear; band centres land at x = 216 / 376 / 538 / 697 / 858, carabiners end y 1195 */
  .p03 { left: 0; top: 0; width: 1080px; height: 1440px; }
  .veil--top { height: 350px; }          /* rail brackets start at y 356 */
  .veil--bot { top: 1198px; }

  /* key line: label hangs from the title's first line, plate sits on its last line */
  .key { position: absolute; left: 684px; top: var(--title-top); height: 172px;
         display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; }
  .key .label { margin-top: 0; }        /* cap line = title cap line */
  .key .num { font-size: 50px; }

  /* level labels, centred under each band (photo order) */
  .lv { position: absolute; top: 1222px; width: 150px; margin-left: -75px; text-align: center; }
  .lv .meter { justify-content: center; margin-bottom: 18px; }
  .lv .kg { font: 800 42px/1 var(--f-text); letter-spacing: -.02em; white-space: nowrap; }
  .lv .label { margin-top: 10px; }
</style>
</head>
<body>
<div class="slide">
  <img class="photo p03" src="../../../src/03_nagruzka.jpg" alt="">
  <div class="veil veil--top"></div>
  <div class="veil veil--bot"></div>

  <header class="chrome">
    <span class="chrome__idx"><b>03</b><i>/08</i></span>
    <span class="chrome__rule"></span>
    <span class="chrome__tag">Нагрузка</span>
  </header>

  <h1 class="title"><span>5 уровней</span><span>нагрузки</span></h1>

  <div class="key">
    <div class="label">Соединяйте<br>вместе&nbsp;—</div>
    <div class="num"><span class="volt">до&nbsp;<b data-spec="res_total_kg"></b>&nbsp;кг</span></div>
  </div>

  <!-- photo order: yellow, red, blue, green, black · meter = level in the true order -->
  <div class="lv" data-band="yellow" style="left:216px">
    <div class="meter" data-level="1"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="kg"><b data-spec="res_yellow_kg"></b>&nbsp;кг</div>
    <div class="label" data-qa="label">очень<br>лёгкая</div>
  </div>
  <div class="lv" data-band="red" style="left:376px">
    <div class="meter" data-level="3"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="kg"><b data-spec="res_red_kg"></b>&nbsp;кг</div>
    <div class="label" data-qa="label">средняя</div>
  </div>
  <div class="lv" data-band="blue" style="left:538px">
    <div class="meter" data-level="4"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="kg"><b data-spec="res_blue_kg"></b>&nbsp;кг</div>
    <div class="label" data-qa="label">тяжёлая</div>
  </div>
  <div class="lv" data-band="green" style="left:697px">
    <div class="meter" data-level="2"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="kg"><b data-spec="res_green_kg"></b>&nbsp;кг</div>
    <div class="label" data-qa="label">лёгкая</div>
  </div>
  <div class="lv" data-band="black" style="left:858px">
    <div class="meter" data-level="5"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="kg"><b data-spec="res_black_kg"></b>&nbsp;кг</div>
    <div class="label" data-qa="label">очень<br>тяжёлая</div>
  </div>
</div>
<script src="../../../lib/bind.js"></script>
</body>
</html>
