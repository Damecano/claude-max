<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>01 · Обложка</title>
<link rel="stylesheet" href="../../../fonts/fonts.css">
<link rel="stylesheet" href="../base.css">
<style>
  /* product: whole ring kept, leftmost point at x ≈ 50 (optical margin),
     ring top ≈ y 458 → ≥ 48 px under the headline descenders */
  .photo { --s: 0.58; --x: -25px; --y: 234px; }

  /* spec stack: info column (right 30 %), anchored to the bottom line */
  .stack { position: absolute; left: var(--info-x); width: var(--info-w); bottom: var(--m); }
  .stack .n11 { display: block; }
  .stack .hr { margin: 30px 0 26px; }
  .lv-row { display: flex; align-items: flex-end; gap: 14px; }
  .lv-row .fact { line-height: 1; text-box: trim-both cap alphabetic; }
  .lv-row .fact span { display: block; margin-top: 9px; }
  .stack .chips { margin-top: 20px; gap: 7px; }
  .stack .chip { width: 46px; }
  .total { margin-top: 30px; }
  .total .meta { display: block; text-box: trim-both cap alphabetic; margin-bottom: 16px; }
</style>
</head>
<body>
  <img class="photo" src="../../../src/01_oblozhka.jpg" alt="">

  <header class="chrome">
    <span class="idx">01<i>/08</i></span>
    <span class="tag">Набор эспандеров</span>
    <span class="rule"></span>
  </header>

  <h1 class="hero"><span>Спортзал</span><span>у вас дома</span></h1>

  <div class="stack">
    <span class="num num--xl n11" data-qa="label"><b data-spec="items_total"></b> в 1</span>
    <div class="hr"></div>
    <div class="lv-row" data-qa="label">
      <span class="num num--l">5</span>
      <span class="fact fact--s">уровней<span>нагрузки</span></span>
    </div>
    <div class="chips" aria-hidden="true"><i class="chip lv1"></i><i class="chip lv2"></i><i class="chip lv3"></i><i class="chip lv4"></i><i class="chip lv5"></i></div>
    <div class="total" data-qa="label">
      <span class="meta">Общая нагрузка</span>
      <span class="bar bar--lead bar--block">до&nbsp;<b data-spec="res_total_kg"></b>&nbsp;кг</span>
    </div>
  </div>

  <script src="../../../lib/bind.js"></script>
</body>
</html>
